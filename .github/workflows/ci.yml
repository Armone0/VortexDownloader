name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: dotnet build VortexDownloader.sln -c Release
      - run: dotnet test tests/VortexDownloader.Tests -c Release --no-build --logger "console;verbosity=normal"

  soak:
    # Slow leak check (300 downloads); runs on main pushes and manual runs, not on every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - run: ./scripts/soak-test.ps1
