name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore VortexDownloader.sln

      - name: Build Solution
        run: dotnet build VortexDownloader.sln -c Release --no-restore

      - name: Run Test Suite
        run: dotnet test VortexDownloader.sln -c Release --no-build --verbosity normal
